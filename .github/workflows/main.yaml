name: main

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '.releases/**'
      - 'infrastructure/kubernetes/overlays/staging/**'
      - 'infrastructure/kubernetes/overlays/prod/**'
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx affected -t lint,typecheck,test,build
      - run: docker compose config --quiet
      - name: Scan repository secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: 1
      - name: Build deployable images
        run: |
          docker build -f apps/backends/api/Dockerfile -t autodev-api:pr .
          docker build -f apps/frontends/web/Dockerfile -t autodev-web:pr .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: autodev-api:pr
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: autodev-web:pr
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  manifests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v5
      - uses: imranismail/setup-kustomize@v2
      - name: Render and validate ${{ matrix.environment }}
        shell: bash
        run: |
          mkdir -p .tmp
          kustomize build "infrastructure/kubernetes/overlays/${{ matrix.environment }}" > .tmp/rendered.yaml
          docker run --rm -v "$PWD/.tmp:/work:ro" ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -ignore-missing-schemas /work/rendered.yaml

  delivery:
    if: github.event_name == 'push'
    needs: [quality, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROMOTION_APP_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: imranismail/setup-kustomize@v2
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backends/api/Dockerfile
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/autodev-api:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontends/web/Dockerfile
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/autodev-web:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Open staging promotion PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          branch="gitops/staging-${GITHUB_SHA}"
          git switch -c "$branch"
          cd infrastructure/kubernetes/overlays/staging
          kustomize edit set image "api=${{ vars.ECR_REGISTRY }}/autodev-api@${API_DIGEST}"
          kustomize edit set image "web=${{ vars.ECR_REGISTRY }}/autodev-web@${WEB_DIGEST}"
          cd ../../../..
          mkdir -p .releases
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg apiRepository "${{ vars.ECR_REGISTRY }}/autodev-api" \
            --arg apiDigest "$API_DIGEST" \
            --arg webRepository "${{ vars.ECR_REGISTRY }}/autodev-web" \
            --arg webDigest "$WEB_DIGEST" \
            '{commit: $commit, api: {repository: $apiRepository, digest: $apiDigest}, web: {repository: $webRepository, digest: $webDigest}}' \
            > .releases/staging.json
          git config user.name "autodev-delivery[bot]"
          git config user.email "autodev-delivery[bot]@users.noreply.github.com"
          git add .releases/staging.json infrastructure/kubernetes/overlays/staging/kustomization.yaml
          git commit -m "chore(gitops): promote ${GITHUB_SHA} to staging"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(gitops): promote ${GITHUB_SHA} to staging" --body "Immutable ECR digests generated by workflow run ${GITHUB_RUN_ID}."

  production:
    if: github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROMOTION_APP_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: imranismail/setup-kustomize@v2
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify staged release in ECR
        shell: bash
        run: |
          test -f .releases/staging.json
          api_digest="$(jq -er '.api.digest | select(test("^sha256:[a-f0-9]{64}$"))' .releases/staging.json)"
          web_digest="$(jq -er '.web.digest | select(test("^sha256:[a-f0-9]{64}$"))' .releases/staging.json)"
          aws ecr describe-images --repository-name autodev-api --image-ids "imageDigest=${api_digest}" >/dev/null
          aws ecr describe-images --repository-name autodev-web --image-ids "imageDigest=${web_digest}" >/dev/null
      - name: Open production promotion PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          api_digest="$(jq -r '.api.digest' .releases/staging.json)"
          web_digest="$(jq -r '.web.digest' .releases/staging.json)"
          commit="$(jq -r '.commit' .releases/staging.json)"
          branch="gitops/production-${commit}"
          git switch -c "$branch"
          cd infrastructure/kubernetes/overlays/prod
          kustomize edit set image "api=${{ vars.ECR_REGISTRY }}/autodev-api@${api_digest}"
          kustomize edit set image "web=${{ vars.ECR_REGISTRY }}/autodev-web@${web_digest}"
          cd ../../../..
          git config user.name "autodev-delivery[bot]"
          git config user.email "autodev-delivery[bot]@users.noreply.github.com"
          git add infrastructure/kubernetes/overlays/prod/kustomization.yaml
          git commit -m "chore(gitops): promote ${commit} to production"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(gitops): promote ${commit} to production" --body "Approved promotion of the immutable staging release."
