name: main

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_digest:
        description: API image digest including sha256 prefix
        required: true
        type: string
      web_digest:
        description: Web image digest including sha256 prefix
        required: true
        type: string

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx affected -t lint,typecheck,test,build
      - run: docker compose config --quiet
      - uses: imranismail/setup-kustomize@v2
      - run: kustomize build infrastructure/kubernetes/overlays/dev
      - name: Build deployable images
        run: |
          docker build -f apps/backends/api/Dockerfile -t autodev-api:pr .
          docker build -f apps/frontends/web/Dockerfile -t autodev-web:pr .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: autodev-api:pr
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: autodev-web:pr
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  delivery:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: imranismail/setup-kustomize@v2
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backends/api/Dockerfile
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/autodev-api:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontends/web/Dockerfile
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/autodev-web:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Update staging desired state
        shell: bash
        run: |
          cd infrastructure/kubernetes/overlays/staging
          kustomize edit set image "api=${{ vars.ECR_REGISTRY }}/autodev-api@${{ steps.api.outputs.digest }}"
          kustomize edit set image "web=${{ vars.ECR_REGISTRY }}/autodev-web@${{ steps.web.outputs.digest }}"
          cd ../../../..
          git config user.name "autodev-delivery[bot]"
          git config user.email "autodev-delivery[bot]@users.noreply.github.com"
          git add infrastructure/kubernetes/overlays/staging/kustomization.yaml
          git commit -m "chore(gitops): promote ${{ github.sha }} to staging [skip ci]"
          git push

  production:
    if: github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: imranismail/setup-kustomize@v2
      - name: Validate requested digests
        shell: bash
        run: |
          [[ "${{ inputs.api_digest }}" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "${{ inputs.web_digest }}" =~ ^sha256:[a-f0-9]{64}$ ]]
      - name: Promote approved digests
        shell: bash
        run: |
          cd infrastructure/kubernetes/overlays/prod
          kustomize edit set image "api=${{ vars.ECR_REGISTRY }}/autodev-api@${{ inputs.api_digest }}"
          kustomize edit set image "web=${{ vars.ECR_REGISTRY }}/autodev-web@${{ inputs.web_digest }}"
          cd ../../../..
          git config user.name "autodev-delivery[bot]"
          git config user.email "autodev-delivery[bot]@users.noreply.github.com"
          git add infrastructure/kubernetes/overlays/prod/kustomization.yaml
          git commit -m "chore(gitops): promote approved release to production [skip ci]"
          git push
